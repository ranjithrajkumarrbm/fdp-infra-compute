name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        default: dev
      bootstrap:
        description: >-
          First create / full rebuild: apply the EKS cluster + node groups on
          their own before the full apply, so the Helm provider has a reachable
          cluster. Leave off for normal applies.
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_STATE_KEY_PREFIX: fdp-infra-compute
  TERRAFORM_VERSION: "1.10.5"

jobs:
  apply:
    runs-on: ubuntu-latest
    # Manual only. Attach required-reviewer protection to the `prod`
    # GitHub Environment to gate applies.
    environment: ${{ inputs.environment }}
    concurrency:
      group: tf-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="key=${TF_STATE_KEY_PREFIX}/${{ inputs.environment }}/terraform.tfstate"

      - name: Terraform validate
        run: terraform validate -no-color

      # Bootstrap phase: on a first create / full rebuild the Helm provider is
      # configured from cluster outputs that are still "known after apply", so
      # helm_release.alb_controller fails before the cluster exists. Applying the
      # cluster + node groups first makes those outputs concrete for the full
      # apply that follows.
      - name: Terraform apply (bootstrap - cluster + node groups)
        if: ${{ inputs.bootstrap }}
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var="environment=${{ inputs.environment }}" \
            -target=module.eks.aws_eks_cluster.this \
            -target=module.eks.aws_eks_node_group.this

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var="environment=${{ inputs.environment }}"

      - name: Terraform outputs
        if: always()
        run: |
          {
            echo "### Terraform Apply - \`${{ inputs.environment }}\`"
            echo '```'
            terraform output -no-color 2>/dev/null || echo "(no outputs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
