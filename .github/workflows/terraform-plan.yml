name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  TF_STATE_KEY_PREFIX: fdp-infra-compute
  TERRAFORM_VERSION: "1.10.5"

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual run -> just the chosen env. Pull request -> dev only
  # (run the plan workflow manually with environment=prod to plan prod).
  matrix:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["dev"]' >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.matrix.outputs.environments) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="key=${TF_STATE_KEY_PREFIX}/${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var="environment=${{ matrix.environment }}" \
            -out=tfplan | tee plan_output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Terraform Plan - \`${{ matrix.environment }}\`"
            echo '```'
            tail -c 60000 plan_output.txt 2>/dev/null || echo "(no plan output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = 'No plan output produced.';
            try { plan = fs.readFileSync('plan_output.txt', 'utf8'); } catch (e) {}
            const env = '${{ matrix.environment }}';
            const marker = `<!-- tf-plan:${env} -->`;
            const body = `${marker}\n### Terraform Plan - \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
