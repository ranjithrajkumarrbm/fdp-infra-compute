name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options: [dev, prod]
        default: dev
      confirm:
        description: Type "destroy" to confirm you really want to tear this down
        required: true
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_STATE_KEY_PREFIX: fdp-infra-compute
  TERRAFORM_VERSION: "1.10.5"

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Attach a required-reviewer rule to this GitHub Environment for a second gate.
    environment: ${{ inputs.environment }}
    concurrency:
      group: tf-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate confirmation
        if: ${{ inputs.confirm != 'destroy' }}
        run: |
          echo "::error::Confirmation failed. Type exactly 'destroy' in the confirm input."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="key=${TF_STATE_KEY_PREFIX}/${{ inputs.environment }}/terraform.tfstate"

      - name: Terraform plan (destroy)
        run: |
          terraform plan -destroy -input=false -no-color -lock-timeout=5m \
            -var="environment=${{ inputs.environment }}"

      - name: Terraform destroy
        run: |
          terraform destroy -input=false -auto-approve -lock-timeout=5m \
            -var="environment=${{ inputs.environment }}"
